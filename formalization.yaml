project:
  name: Frankl–Wilson and Ray-Chaudhuri–Wilson intersection bounds
  description: Sharp uniform restricted-intersection bounds in characteristic zero and modulo a prime, with
    modular nonuniform, forbidden-residue and finite-coloring consequences. Extends the verified Ray-Chaudhuri–Wilson
    package without changing its four selected results.
  authors:
  - Juan Pablo Traverso Gianini
  license: Apache-2.0
  responsible_maintainers:
  - Juan Pablo Traverso Gianini
