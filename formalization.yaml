  authors:
  - Dijen K. Ray-Chaudhuri
  - Richard M. Wilson
  id: doi:10.18910/7296
  type: paper
  location: Osaka Journal of Mathematics 12(3) (1975), 737–744, Theorem 3
  relationship: formalizes
  note: The institutional archival DOI identifies the open paper. Consulted https://www.i-repository.net/contents/osakacu/sugaku/111F0000002-01203-15.pdf.
    Formalizes the uniform restricted-intersection bound, with stated corollaries and sharpness examples, not
    the full paper. The new proof uses squarefree evaluation spaces, homogenization, and diagonal separation
    rather than the original matrix argument.
  license: unknown
  author_endorsement: n/a
- title: Intersection theorems with geometric consequences
  authors:
  - Péter Frankl
  - Richard M. Wilson
  id: doi:10.1007/BF02579457
  type: paper
  location: 'Combinatorica 1(4) (1981), 357–368: uniform modular intersection theorem'
  relationship: formalizes
  note: 'The primary publisher abstract states the sharp modular uniform bound. Public scan: https://www.cs.umd.edu/~gasarch/TOPICS/CRT/FW.pdf
    (image-only in the available reader). The formal statement includes |L| ≤ k, a necessary parameter condition
    under the standard zero convention for binomial coefficients. Covers the uniform prime-modular theorem
    and explicitly identified consequences; not the whole paper or its Euclidean asymptotics.'
  license: unknown
  author_endorsement: n/a
