status:
  scope: 'Finite families of finite subsets of an arbitrary finite ground type. Eight selected statements:
    four preserved Ray-Chaudhuri–Wilson results, the sharp uniform prime-modular bound, the modular nonuniform
    sum-binomial bound with explicit diagonal exclusion, the forbidden block-size residue bound, and a finite
    coloring inequality. Three compared definitions, eight intentional theorem placeholders only in the independent
    Challenge. Empty cases are included.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
automation:
  methods:
  - method: agent
    models:
    - OpenAI Codex
    framework: Codex
    tool_setup: Reused the existing arbitrary-field evaluation/separation lemmas and characteristic-zero homogenization.
      New integer evaluation matrix reduces to a nonsingular diagonal matrix over ZMod p. Its determinant lifts
      to a nonzero rational determinant, proving independence of rational separator evaluations. A new degree-space
      dimension lemma counts all squarefree supports of size at most s. Verified strict Lean builds, boundary/axiom
      audit and sandboxed Comparator with Lean and NanoDa. No sub-agent or external proving service was used.
    prompting_notes: Human-directed Spanish instructions to continue the prioritized backlog, reusing available
      infrastructure. No external proving service or sub-agent was used.
  notes: All new application proofs were produced in this project; existing Mathlib infrastructure is reused.
    Costs and wall time were not tracked.
fidelity:
  divergences: Preserves all four prior RCW contracts. In the new uniform theorem p is prime, L is a Finset
    (ZMod p), F is k-uniform, |L| ≤ k, k modulo p is outside L, and every distinct-pair intersection residue
    is in L. These are the only hypotheses; determinant nonvanishing and dimension bounds are proved. The parameter
    |L| ≤ k is necessary with Nat.choose, as a checked counterexample shows. No condition |L| ≤ k modulo p,
    nor k < p, is imposed. The modular nonuniform theorem explicitly excludes every block-size residue from
    L; it is not the unrestricted nonmodular nonuniform theorem. The coloring consequence concerns a finite
    modular intersection graph, not the paper’s Euclidean distance graphs or asymptotic constants. Composite/prime-power
    moduli, the unrestricted nonmodular nonuniform theorem, and the rest of either paper are not formalized.
review:
  status: self-assessed
  reviewers:
  - OpenAI Codex (implementing agent, self-assessment)
  notes: 'Self-assessment: cross-checked the main modular assertion against the primary publisher abstract
    and Alon–Babai–Suzuki Theorem 1.2. The available primary scan is image-only; no theorem numbering from
    that scan is asserted. Boundary audit covers sharp modular pairs, k modulo p below |L|, zero degree, necessary
    |L| ≤ k, a genuinely nonuniform modular family, and an impossible one-color instance. Eight result types
    and three definitions are checked independently. Only propext, Classical.choice and Quot.sound are permitted.
    No independent human review or mathematical novelty is claimed. Preflight is not registry registration.'
